name: deploy

# Every push to main — whether a human edit or the refresh-data bot's commit — is gated on
# scripts/check-content-contracts.ts before it builds or deploys: every non-'sourced' provenance
# note and every weak-both-axes flags array (see the file's own contract in src/data/empirical.ts)
# must be present. Born from a content-QA audit + adversarial review that rejected a calendar-based
# staleness gate as self-defeating but kept this kind — a pure structural fact about the data, not
# a judgment call, so it can't be satisfied by editing a date.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Gate — content contracts (empirical.ts provenance notes + flags)
        run: node --experimental-strip-types scripts/check-content-contracts.ts

      - run: npm run build
        env:
          GITHUB_ACTIONS: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
